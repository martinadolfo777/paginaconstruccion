<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Diseño de Losa – Flexión (Multi-Claros)</title>
<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f0f2f5;
    padding: 30px;
}
.container {
    background: #ffffff;
    padding: 25px;
    border-radius: 8px;
    max-width: 1300px;
    margin: auto;
}
h1, h2 { text-align: center; }
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}
th, td {
    border: 1px solid #bbb;
    padding: 8px;
    text-align: center;
}
th { background: #e6e6e6; }
.ok { background: #d4edda; font-weight: bold; }
.warn { background: #f8d7da; font-weight: bold; }
input, select { width: 100%; }
button {
    margin-top: 15px;
    padding: 10px;
    font-size: 15px;
}
.section { margin-top: 35px; }
.flex { display: flex; gap: 10px; }
</style>
</head>

<body>
<div class="container">

<h1>Diseño de Losa a Flexión</h1>
<h2>ACI 318 – Análisis por Momentos Críticos</h2>

<div class="section">
<h3>Datos generales</h3>
<table>
<tr><td>f'c (kgf/cm²)</td><td><input id="fc" value="250"></td></tr>
<tr><td>f'y (kgf/cm²)</td><td><input id="fy" value="4220"></td></tr>
<tr><td>ϕ</td><td><input id="phi" value="0.90"></td></tr>
<tr><td>b (cm)</td><td><input id="bw" value="100"></td></tr>
<tr><td>d (cm)</td><td><input id="d_eff" value="13"></td></tr>
</table>
</div>

<div class="section">
<h3>Momentos / Claros</h3>

<table id="tablaClaros">
<tr>
<th>Claro</th>
<th>Mn (kgf·m)</th>
<th>Varilla</th>
<th>No. Varillas</th>
</tr>
</table>

<div class="flex">
<button onclick="agregarClaro()">Añadir claro</button>
<button onclick="calcular()">Calcular</button>
</div>
</div>

<div class="section">
<h3>Resultados</h3>
<table id="tablaResultados">
<tr>
<th>Claro</th>
<th>As requerida (cm²)</th>
<th>As colocada (cm²)</th>
<th>a (cm)</th>
<th>Mn verificado (kgf·m)</th>
<th>Estado del acero</th>
</tr>
</table>
</div>

</div>

<script>
let contador = 0;

function agregarClaro(){
    contador++;
    let tabla = document.getElementById("tablaClaros");
    tabla.innerHTML += `
<tr>
<td>${contador}</td>
<td><input id="Mn_${contador}" value="614.20"></td>
<td>
<select id="A_${contador}">
<option value="0.71">#3</option>
<option value="1.27" selected>#4</option>
<option value="1.99">#5</option>
<option value="2.85">#6</option>
<option value="5.07">#8</option>
</select>
</td>
<td><input id="N_${contador}" value="1"></td>
</tr>`;
}

function resolverAs(Mn_phi, fy, d, fc, bw){
    let A = fy * d;
    let B = fy*fy / (2 * 0.85 * fc * bw);
    let disc = A*A - 4*B*Mn_phi;
    if (disc <= 0) return 0;
    return (A - Math.sqrt(disc)) / (2*B);
}

function evaluar(Mn, Abar, n){
    let fc = +fcEl.value, fy = +fyEl.value, phi = +phiEl.value;
    let bw = +bwEl.value, d = +dEl.value;

    let beta1 = fc <= 280 ? 0.85 : Math.max(0.65, 0.85 - (fc-280)/700);
    let Mn_phi = Mn * 100 / phi;

    let As_req = resolverAs(Mn_phi, fy, d, fc, bw);
    let As = Abar * n;

    let a = As * fy / (0.85 * fc * bw);
    let c = a / beta1;

    let Es = 2_000_000;
    let eps_s = 0.003 * (d - c) / c;
    let eps_y = fy / Es;

    let estado = eps_s >= eps_y ? "FLUYE" : "NO FLUYE";
    let clase = eps_s >= eps_y ? "ok" : "warn";

    let Mn_ver = As * fy * (d - a/2) / 100;

    return {As_req, As, a, Mn_ver, estado, clase};
}

const fcEl = document.getElementById("fc");
const fyEl = document.getElementById("fy");
const phiEl = document.getElementById("phi");
const bwEl = document.getElementById("bw");
const dEl = document.getElementById("d_eff");

function calcular(){
    let tabla = document.getElementById("tablaResultados");
    tabla.innerHTML = `
<tr>
<th>Claro</th>
<th>As requerida (cm²)</th>
<th>As colocada (cm²)</th>
<th>a (cm)</th>
<th>Mn verificado (kgf·m)</th>
<th>Estado del acero</th>
</tr>`;

    for(let i=1;i<=contador;i++){
        let r = evaluar(
            +document.getElementById(`Mn_${i}`).value,
            +document.getElementById(`A_${i}`).value,
            +document.getElementById(`N_${i}`).value
        );

        tabla.innerHTML += `
<tr class="${r.clase}">
<td>${i}</td>
<td>${r.As_req.toFixed(3)}</td>
<td>${r.As.toFixed(3)}</td>
<td>${r.a.toFixed(3)}</td>
<td>${r.Mn_ver.toFixed(2)}</td>
<td>${r.estado}</td>
</tr>`;
    }
}

// Crear 3 claros iniciales
for(let i=0;i<3;i++) agregarClaro();
</script>

</body>
</html>
