<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Diseño de Losa – Flexión (ACI 318)</title>
<style>
body{font-family:Arial;background:#f2f2f2;padding:20px}
.container{background:#fff;padding:20px;border-radius:6px;max-width:1100px;margin:auto}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #aaa;padding:6px;text-align:center}
th{background:#e0e0e0}
.ok{background:#d4edda;font-weight:bold}
.warn{background:#f8d7da;font-weight:bold}
input{width:100%}
button{margin-top:15px;padding:10px;font-size:14px}
</style>
</head>

<body>
<div class="container">

<h2>Diseño de Losa a Flexión – ACI 318</h2>

<table>
<tr><td>f'c (kgf/cm²)</td><td><input id="fc" value="250"></td></tr>
<tr><td>f'y (kgf/cm²)</td><td><input id="fy" value="4220"></td></tr>
<tr><td>ϕ</td><td><input id="phi" value="0.90"></td></tr>
<tr><td>b (cm)</td><td><input id="b" value="100"></td></tr>
<tr><td>d (cm)</td><td><input id="d" value="13"></td></tr>
</table>

<table id="tabla">
<tr>
<th>Claro</th>
<th>Mn (kgf·m)</th>
<th>As req (cm²)</th>
<th>As prop (cm²)</th>
<th>Var</th>
<th>Cantidad</th>
<th>Mn verif</th>
<th>Estado</th>
</tr>
</table>

<button onclick="agregar()">Agregar Claro</button>
<button onclick="calcular()">Calcular</button>

</div>

<script>
let n = 0;

// Catálogo de varillas
const barras = [
 {n:"#3",A:0.71},{n:"#4",A:1.27},{n:"#5",A:1.99},
 {n:"#6",A:2.85},{n:"#8",A:5.07}
];

function agregar(){
 n++;
 tabla.innerHTML += `
 <tr>
 <td>${n}</td>
 <td><input id="Mn${n}" value="614.2"></td>
 <td></td><td></td><td></td><td></td><td></td><td></td>
 </tr>`;
}

function AsReq(Mn,fy,d,fc,b,phi){
 let Mu = Mn*100/phi;
 let A = fy*d;
 let B = fy*fy/(2*0.85*fc*b);
 return (A-Math.sqrt(A*A-4*B*Mu))/(2*B);
}

function calcular(){
 let fc=+fcEl.value,fy=+fyEl.value,phi=+phiEl.value;
 let b=+bEl.value,d=+dEl.value;
 let beta1=fc<=280?0.85:Math.max(0.65,0.85-(fc-280)/700);

 for(let i=1;i<=n;i++){
  let Mn=+document.getElementById("Mn"+i).value;
  let Asr=AsReq(Mn,fy,d,fc,b,phi);

  let mejor=null;
  barras.forEach(bar=>{
   for(let k=1;k<=10;k++){
    let As=bar.A*k;
    if(As>=Asr){
     let exc=As-Asr;
     if(!mejor||exc<mejor.exc)
      mejor={bar:bar.n,k,As,exc};
    }
   }
  });

  let a=mejor.As*fy/(0.85*fc*b);
  let MnV=mejor.As*fy*(d-a/2)/100;
  let ok=MnV>=Mn;
  let fila=tabla.rows[i];

  fila.cells[2].innerHTML=Asr.toFixed(3);
  fila.cells[3].innerHTML=mejor.As.toFixed(3);
  fila.cells[4].innerHTML=mejor.bar;
  fila.cells[5].innerHTML=mejor.k;
  fila.cells[6].innerHTML=MnV.toFixed(1);
  fila.cells[7].innerHTML=ok?"OK":"NO CUMPLE";
  fila.className=ok?"ok":"warn";
 }
}

const fcEl=fc,fyEl=fy,phiEl=phi,bEl=b,dEl=d;

// 3 claros iniciales
agregar();agregar();agregar();
</script>

</body>
</html>
